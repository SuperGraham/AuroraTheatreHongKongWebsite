name = "aurora-theatre-hk"
main = "src/worker.js"
compatibility_date = "2026-07-13"
compatibility_flags = ["nodejs_compat"]
account_id = "661d70ec50f4197ddfb3f4db6f848960"
# Keep the *.workers.dev endpoint alive. Wrangler silently defaults this to
# false as soon as `routes` exists, which takes the endpoint offline — worth
# leaving explicit so a future edit to routes can't knock it out again.
workers_dev = true

# www only — it's the canonical host: SITE_URL, the sitemap and every
# canonical tag use it, and every URL Google has indexed is www.
routes = [
  { pattern = "www.auroratheatrehk.com", custom_domain = true },
]

[vars]
SES_TO_EMAIL = "nicolewest1920@gmail.com"
SES_FROM_EMAIL = "hello@auroratheatrehk.com"
AWS_REGION = "eu-west-2"

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "404-page"
# Scoped, not `true` — only these paths invoke src/worker.js; everything
# else is served straight from public/ with zero Worker execution. Every
# exact key in src/redirects.js's REDIRECTS needs its own entry here, and
# every REDIRECT_PREFIXES prefix needs a matching "/prefix/*" entry — keep
# both files in sync when either changes. Exception: skip an exact entry
# here if it's already covered by one of this list's own prefixes (e.g.
# "/old/contact/" under "/old/*") — wrangler's deploy-time validation
# rejects redundant exact-path entries as an error, not just a no-op. The
# Worker's own REDIRECTS-before-REDIRECT_PREFIXES check order still routes
# it correctly once the broader prefix rule lets the request through.
run_worker_first = [
  "/contact",
  "/about/",
  "/sponsors/",
  "/gallery/",
  "/privacy-policy/",
  "/past-productions/",
  "/current-productions/",
  "/contact/",
  "/coaching/",
